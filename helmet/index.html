<!DOCTYPE html>
<!-- Written with AI assistance (Claude / GitHub Copilot) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sightline — Helmet view</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=switzer@400,500,600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="helmet.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="../lib/terrain.js"></script>
  <script src="../lib/models.js"></script>
  <script src="../lib/ground.js"></script>
</head>
<body>
  <a-scene id="scene" embedded loading-screen="enabled: false" background="color: #c9a27e"
           fog="type: linear; color: #c9a27e; near: 200; far: 30000"
           renderer="antialias: true; foveationLevel: 0" vr-mode-ui="enabled: true">
    <a-entity id="hemi" light="type: hemisphere; color: #ffd9b0; groundColor: #4a2a18; intensity: 0.75"></a-entity>
    <a-entity id="sun" light="type: directional; color: #fff1dc; intensity: 1.5" position="-4000 5000 3000"></a-entity>
    <a-entity id="rig">
      <a-entity id="cam" camera="near: 0.5; far: 60000" look-controls="pointerLockEnabled: false; reverseMouseDrag: true; reverseTouchDrag: true"></a-entity>
    </a-entity>
  </a-scene>

  <!-- 2D overlay (text is always set with textContent from helmet.js) -->
  <div id="hud" aria-label="Helmet display">
    <div id="visor" aria-hidden="true"></div>

    <div id="top">
      <!-- compass tape: one translated element, scrolled by the view heading -->
      <div id="strip" aria-hidden="true">
        <div id="tape-clip"><div id="tape"></div></div>
        <div id="tape-notch"></div>
        <div id="tape-home" hidden>H</div>
      </div>

      <div id="top-row">
        <section id="panel-time" class="panel small">
          <div class="row"><span>Suit time</span><b id="time-suit">&mdash;</b></div>
          <div class="row"><span>To walk home</span><b id="time-home">&mdash;</b></div>
          <div class="row" id="row-turn" hidden><span>Turn back in</span><b id="time-turn">&mdash;</b></div>
          <div id="hud-tag" class="tag"></div>
        </section>

        <div id="top-center">
          <section id="panel-status" class="panel" data-level="none" aria-live="polite">
            <div id="hud-headline" class="headline">STANDBY</div>
            <div id="hud-sub" class="sub" hidden></div>
          </section>
          <div id="storm" class="banner" role="alert" hidden></div>
        </div>

        <section id="panel-env" class="panel small">
          <div class="row"><span>Dust &tau;</span><b id="env-tau">&mdash;</b></div>
          <div class="row"><span>Visibility</span><b id="env-vis">&mdash;</b></div>
          <div class="row"><span>Position</span><b id="env-unc">&mdash;</b></div>
          <div id="env-route" class="route-note"></div>
        </section>
      </div>
    </div>

    <section id="panel-factors" class="panel" hidden>
      <ul id="factors"></ul>
    </section>

    <div id="home-card" class="panel" aria-live="polite">
      <div id="home-dist">Home &mdash;</div>
      <div id="home-state" hidden></div>
    </div>

    <div id="home-label" class="mark home" hidden><span id="home-main"></span><span id="home-sub" class="mark-sub" hidden></span></div>
    <div id="landmark-labels"></div>

    <div id="notes" class="notes"></div>
  </div>
  <!-- one settings button (bottom right) holds graphics + what is shown, so the HUD edges stay clean -->
  <button type="button" id="hud-settings" class="hud-btn" aria-expanded="false" aria-controls="view-menu" aria-label="View settings" title="View settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
  <div id="view-menu" hidden>
    <div id="gfx" role="group" aria-label="Graphics quality">
      <span class="gfx-title">Graphics</span>
      <button type="button" data-q="auto" aria-pressed="true">Auto</button>
      <button type="button" data-q="low" aria-pressed="false">Low</button>
      <button type="button" data-q="medium" aria-pressed="false">Med</button>
      <button type="button" data-q="high" aria-pressed="false">High</button>
      <span id="gfx-level" class="gfx-meta"></span>
      <span id="gfx-fps" class="gfx-meta"></span>
    </div>
    <fieldset id="show" aria-label="Show in view">
      <legend class="gfx-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>Show</legend>
      <label><input type="checkbox" data-show="beacon" checked>Home beacon</label>
      <label><input type="checkbox" data-show="route" checked>Route</label>
      <label><input type="checkbox" data-show="landmarks" checked>Landmarks</label>
      <label><input type="checkbox" data-show="dust" checked>Blowing dust</label>
    </fieldset>
  </div>
  <div id="fps" hidden></div>
  <div id="zoom" hidden></div>

  <div id="state-card" role="status" aria-live="polite">
    <div id="state-title">Loading terrain…</div>
    <div id="state-detail"></div>
  </div>

  <script type="module" src="helmet.js"></script>
</body>
</html>
